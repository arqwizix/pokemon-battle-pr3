<!doctype html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Pokemon Fight</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="body">
    <header>
        <img class="logo"
             title="Reset Game"
             src="./assets/Pokemon_logo.png"
             alt="Pokemon">
    </header>
    <div class="playground">
        <div class="pokemon character">
            <span class="lvl">Lv. 1</span>

            <span class="sprite pokemon-symbol pikachu-symbol" role="img" aria-label="Pikachu">⚡</span>

            <div class="details">
                <h2 class="name" id="name-character">
                    Pikachu
                </h2>
                <div class="hp">
                    <div class="bar">
                        <div class="health" id="progressbar-character" style="width: 100%;"></div>
                    </div>
                    <span class="text" id="health-character">100 / 100</span>
                </div>
            </div>
        </div>

        <div class="control">
            <button class="button" id="btn-kick" type="button">Thunder Jolt</button>
            <button class="button" id="btn-strong" type="button">Thunderbolt</button>
            <button class="button reset-button" id="btn-reset" type="button">Нова гра</button>
            <p class="battle-message" id="battle-message" aria-live="polite">Оберіть атаку, щоб розпочати бій.</p>
        </div>

        <div class="pokemon enemy">
            <span class="lvl">Lv. 1</span>

            <span class="sprite pokemon-symbol charmander-symbol" role="img" aria-label="Charmander">🔥</span>

            <div class="details">
                <h2 class="name" id="name-enemy">
                    Charmander
                </h2>
                <div class="hp">
                    <div class="bar">
                        <div class="health" id="progressbar-enemy" style="width: 100%;"></div>
                    </div>
                    <span class="text" id="health-enemy">100 / 100</span>
                </div>
            </div>
        </div>
    </div>
    <section class="battle-history" aria-label="Журнал бою">
        <h3>Журнал бою</h3>
        <div id="logs" aria-live="polite" aria-relevant="additions text"></div>
    </section>
</div>
<div class="catch_screen"></div>

<script src="logs.js"></script>
<script src="main.js"></script>
</body>
</html>
